name: Deploy store.privasys.org to OVH

# Deploys the static `store.privasys.org` Next export to the OVH web host under
# `/var/websites/store.privasys.org/`, served by nginx. Mirrors
# deploy-privasys-org.yml. DNS / the nginx server block for store.privasys.org
# must point at that directory (wired separately).
#
# NEXT_PUBLIC_API_BASE_URL selects which management-service the store reads its
# published apps from (defaults to production).

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'management-service base URL the store reads from'
        required: false
        type: string
        default: 'https://api.developer.privasys.org'
      smoke:
        description: 'Run post-deploy HTTP smoke test'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-store-privasys-org
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy store.privasys.org
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: 1
      AWS_ACCESS_KEY_ID: ${{ secrets.NX_CACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NX_CACHE_AWS_SECRET_ACCESS_KEY }}
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn install --network-timeout 1000000 --immutable

      - name: Build store.privasys.org static export
        run: |
          set -euo pipefail
          npx nx reset
          npx nx run store.privasys.org:build --skip-nx-cache
          test -f dist/apps/fronts/store.privasys.org/.next/index.html
          test -d dist/apps/fronts/store.privasys.org/.next/_next/static
          echo "::group::Files to deploy"
          find dist/apps/fronts/store.privasys.org/.next -maxdepth 2 -type f | sort | head -200
          echo "::endgroup::"

      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.OVH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stage build on OVH and publish atomically
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          DIST=dist/apps/fronts/store.privasys.org/.next
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          STAGING="store-privasys-org-builds/${TAG}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" "mkdir -p ${STAGING}"
          rsync -avz --delete \
            -e "ssh -p ${PORT} -i ~/.ssh/id_ed25519" \
            "${DIST}/" "${OVH_USER}@${OVH_HOST}:${STAGING}/"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" "set -euo pipefail; \
            cd \$HOME && \
            sudo mkdir -p /var/websites/store.privasys.org && \
            sudo rsync -av --delete \
              ${STAGING}/ /var/websites/store.privasys.org/ && \
            sudo nginx -t && sudo systemctl reload nginx"

      # Pretty per-app URLs (/apps/<slug>) are what the portal hands a developer
      # on publish. The store is a static export, so nginx has to serve the
      # exported /app page for any /apps/* path — otherwise an app published
      # after the last deploy 404s. Idempotent; `nginx -t` gates the reload and
      # the original block is restored if the edit does not validate, so this
      # can never take the host down.
      - name: Ensure nginx serves /apps/<slug>
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          # Single-quoted: nothing expands locally. \$uri reaches the remote
          # shell as $uri inside the double-quoted sed script.
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" 'set -eu; \
            CONF=/etc/nginx/sites-available/store.privasys.org; \
            if sudo grep -q "location \^~ /apps/" "$CONF"; then echo "already present"; exit 0; fi; \
            sudo cp "$CONF" "$CONF.bak"; \
            sudo sed -i "/^    index index.html;$/a\\    location ^~ /apps/ { try_files \$uri \$uri/ /app/index.html; }" "$CONF"; \
            if sudo nginx -t; then \
              sudo systemctl reload nginx; sudo rm -f "$CONF.bak"; echo "installed /apps/ fallback"; \
            else \
              sudo mv "$CONF.bak" "$CONF"; sudo nginx -t; \
              echo "edit rejected by nginx -t; original restored" >&2; exit 1; \
            fi'

      - name: Smoke test
        if: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          ROOT=$(curl -sS -o /tmp/store-index.html -w '%{http_code}' https://store.privasys.org/)
          echo "root=$ROOT"
          test "$ROOT" = "200"
          grep -q 'App Store' /tmp/store-index.html
          # A published app must be reachable at its pretty URL.
          SLUG=$(curl -sS "${NEXT_PUBLIC_API_BASE_URL:-https://api.developer.privasys.org}/api/v1/store/apps" \
            | sed -n 's/.*"slug":"\([^"]*\)".*/\1/p' | head -1)
          if [ -n "$SLUG" ]; then
            APP=$(curl -sS -o /dev/null -w '%{http_code}' "https://store.privasys.org/apps/${SLUG}")
            echo "apps/${SLUG}=$APP"
            test "$APP" = "200"
          fi

      - name: Prune old staged builds on OVH (keep last 5)
        if: always()
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" \
            "ls -1t ~/store-privasys-org-builds 2>/dev/null | tail -n +6 | xargs -r -I{} rm -rf ~/store-privasys-org-builds/{}" || true
