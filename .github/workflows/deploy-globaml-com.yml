name: Deploy globaml.com to OVH

# Deploys the static globaml.com placeholder (apps/fronts/globaml.com, built
# files, no build step) to `vm-ovh-fr-par-1` under /var/websites/globaml.com/.
# Nginx serves the directory directly (TLS via Let's Encrypt), so publishing
# is an atomic rsync. Same OVH SSH secrets as the other static fronts.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Run post-deploy HTTP smoke test'
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-globaml-com
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy globaml.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Check the site
        run: |
          set -euo pipefail
          SITE=apps/fronts/globaml.com
          test -f "$SITE/index.html"
          test -f "$SITE/fonts/Archivo.woff2"
          # Fonts come from the site, never from Google.
          ! grep -q 'fonts.googleapis.com\|fonts.gstatic.com' "$SITE/index.html"

      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.OVH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stage on OVH and publish atomically
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          STAGING="globaml.com-builds/${TAG}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" "mkdir -p ${STAGING}"
          rsync -avz --delete --exclude README.md --chmod=D755,F644 \
            -e "ssh -p ${PORT} -i ~/.ssh/id_ed25519" \
            apps/fronts/globaml.com/ "${OVH_USER}@${OVH_HOST}:${STAGING}/"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" "set -euo pipefail; \
            cd \$HOME && \
            sudo mkdir -p /var/websites/globaml.com && \
            sudo rsync -av --delete --chmod=D755,F644 \
              ${STAGING}/ /var/websites/globaml.com/ && \
            sudo nginx -t && sudo systemctl reload nginx"

      - name: Smoke test
        if: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          ROOT=$(curl -sS -o /tmp/globaml-index.html -w '%{http_code}' https://globaml.com/)
          echo "root=$ROOT"
          test "$ROOT" = "200"
          grep -q '<title>GlobAML</title>' /tmp/globaml-index.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://globaml.com/fonts/Archivo.woff2)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://www.globaml.com/)" = "301"

      - name: Prune old staged builds on OVH (keep last 5)
        if: always()
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" \
            "cd \$HOME/globaml.com-builds 2>/dev/null && ls -1t | tail -n +6 | xargs -r rm -rf"
