name: Deploy Chat to OVH

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: test
        options:
          - test
          - prod

concurrency:
  group: deploy-chat-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_TELEMETRY_DISABLED: 1
      AWS_ACCESS_KEY_ID: ${{ secrets.NX_CACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NX_CACHE_AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve target config
        id: target
        run: |
          set -euo pipefail
          ENV='${{ github.event.inputs.environment }}'
          if [[ "$ENV" == 'prod' ]]; then
            echo "container=chat-prod"                          >> "$GITHUB_OUTPUT"
            echo "host_port=3010"                               >> "$GITHUB_OUTPUT"
            echo "env_file=~/chat.env"                          >> "$GITHUB_OUTPUT"
            # Production chat is backed by the prod inference fleet on the
            # prod management-service (api.developer.privasys.org): fleet
            # "demo" -> prod confidential-ai enclave on m2-tdx-gpu. Staging
            # (chat.test.privasys.org) now points at the same prod fleet,
            # since the dev inference VM no longer exists.
            echo "api_url=https://api.developer.privasys.org" >> "$GITHUB_OUTPUT"
            echo "default_instance=demo"                        >> "$GITHUB_OUTPUT"
            # No dedicated chat-service back-end in prod yet: leave the
            # chat-service URL empty so BYO-MCP stays fully dormant there.
            echo "chat_service_url="                            >> "$GITHUB_OUTPUT"
            # Drive ↔ Chat (§8.7) / Memory. The prod Drive instance now
            # exists (privasys-drive on m1-tdx-france) and is reachable from
            # the inference enclave as an ATTESTED ai_tool — mutual RA-TLS,
            # no shared secret, with the acting user carried as
            # X-Privasys-On-Behalf-Of. So the host is filled in and the
            # feature is live; an empty value here is what kept Memory
            # dormant in prod after the front already shipped it.
            # Staging keeps pointing at the DEV Drive below, so prod data is
            # never read or written from chat.test.privasys.org.
            echo "drive_app_host=privasys-drive.apps.privasys.org" >> "$GITHUB_OUTPUT"
            # Chat is replaced by the Privasys Harness (2026-09-09): the
            # front is a 301 to the harness served from its own enclave.
            echo "harness_host=harness.apps.privasys.org"          >> "$GITHUB_OUTPUT"
          else
            echo "container=chat"                                  >> "$GITHUB_OUTPUT"
            echo "host_port=3011"                                  >> "$GITHUB_OUTPUT"
            # VM-side env file, named after the environment rather than the
            # host, so the chat.test.privasys.org move does not rename it.
            echo "env_file=~/chat-test.env"                        >> "$GITHUB_OUTPUT"
            # There is no dev inference fleet any more
            # (confidential-ai.apps-test no longer resolves), so
            # chat.test.privasys.org is backed by the PROD management-service,
            # whose "demo" alias is the prod fleet (canonical confidential-ai
            # on m4-tdx-gpu since the 2026-08-27 cutover). The "staging"
            # alias (cai-probe2, same enclave) exists for validating engine
            # rolls before they reach canonical.
            echo "api_url=https://api.developer.privasys.org"      >> "$GITHUB_OUTPUT"
            echo "default_instance=demo"                           >> "$GITHUB_OUTPUT"
            # BYO-MCP stays dormant here: the dev chat-service enclave is down,
            # and a grant it minted would carry an audience the prod instance
            # rejects, so an empty URL is the honest wiring.
            echo "chat_service_url="                               >> "$GITHUB_OUTPUT"
            # Drive ↔ Chat (§8.7) deliberately stays on the DEV Drive enclave
            # so staging never reads or writes production Drive data.
            echo "drive_app_host=drive-demo.apps.test.privasys.org" >> "$GITHUB_OUTPUT"
            # Staging redirects to the dev harness.
            echo "harness_host=attested-harness.apps.test.privasys.org" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$(date -u +%Y%m%d-%H%M%S)-${ENV}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn install --network-timeout 1000000 --immutable

      - name: Build chat
        run: |
          set -euo pipefail
          {
            echo "NEXT_PUBLIC_API_BASE_URL=${{ steps.target.outputs.api_url }}"
            echo "NEXT_PUBLIC_DEFAULT_INSTANCE=${{ steps.target.outputs.default_instance }}"
            echo "NEXT_PUBLIC_CHAT_SERVICE_URL=${{ steps.target.outputs.chat_service_url }}"
            echo "NEXT_PUBLIC_DRIVE_APP_HOST=${{ steps.target.outputs.drive_app_host }}"
            echo "NEXT_PUBLIC_HARNESS_HOST=${{ steps.target.outputs.harness_host }}"
            # Build provenance shown bottom-left in the sidebar (links to
            # the exact commit on GitHub).
            echo "NEXT_PUBLIC_COMMIT_SHA=${GITHUB_SHA}"
            echo "NEXT_PUBLIC_APP_VERSION=$(node -p "require('./apps/fronts/chat.privasys.org/package.json').version")"
          } > apps/fronts/chat.privasys.org/.env.local
          npx nx reset
          npx nx build chat.privasys.org --skip-nx-cache

      - name: Assemble build context
        run: |
          set -euo pipefail
          DIST=dist/apps/fronts/chat.privasys.org/.next
          APP=apps/fronts/chat.privasys.org
          rm -rf /tmp/chat-build
          mkdir -p /tmp/chat-build
          cp -r "$DIST/standalone" /tmp/chat-build/standalone
          cp -r "$DIST/static"     /tmp/chat-build/static
          cp -r "$APP/public"      /tmp/chat-build/public
          cp    "$APP/Dockerfile"  /tmp/chat-build/Dockerfile

      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.OVH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stream build context to OVH and build image
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          cd /tmp/chat-build
          tar -cf - standalone static public Dockerfile | \
            ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" \
              "set -euo pipefail; mkdir -p ~/chat-builds/${TAG} && cd ~/chat-builds/${TAG} && tar -xf - && sudo docker build -t chat:${TAG} ."

      - name: Swap container
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          TAG: ${{ steps.target.outputs.tag }}
          CONTAINER: ${{ steps.target.outputs.container }}
          HOST_PORT: ${{ steps.target.outputs.host_port }}
          ENV_FILE: ${{ steps.target.outputs.env_file }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" "set -euo pipefail; \
            sudo docker stop ${CONTAINER} 2>/dev/null || true; \
            sudo docker rm   ${CONTAINER} 2>/dev/null || true; \
            sudo docker run -d --name ${CONTAINER} --restart unless-stopped \
              -p ${HOST_PORT}:3000 \
              --env-file ${ENV_FILE} \
              chat:${TAG}"

      - name: Smoke test (root + instance redirect)
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          CONTAINER: ${{ steps.target.outputs.container }}
          HOST_PORT: ${{ steps.target.outputs.host_port }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" "set -euo pipefail; \
            ROOT=\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:${HOST_PORT}/); \
            echo root=\$ROOT; \
            test \"\$ROOT\" = '307' -o \"\$ROOT\" = '308' -o \"\$ROOT\" = '200' || { echo 'root failed'; sudo docker logs ${CONTAINER} --tail 50; exit 1; }"

      # The chat attestation smoke (available_tools[] of the fleet) is gone
      # with the fleet's AI tool rows: the harness owns the tools now, and
      # this front only redirects to it. The redirect itself is the smoke:
      - name: Smoke test (redirects to the harness)
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
          HOST_PORT: ${{ steps.target.outputs.host_port }}
          HARNESS_HOST: ${{ steps.target.outputs.harness_host }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" "set -euo pipefail; \
            LOC=\$(curl -sS -o /dev/null -w '%{redirect_url}' http://127.0.0.1:${HOST_PORT}/i/demo/); \
            echo redirect=\$LOC; \
            test \"\$LOC\" = 'https://${HARNESS_HOST}/' || { echo 'redirect target wrong'; exit 1; }"

      - name: Prune old build directories on OVH (keep last 5)
        if: always()
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_SSH_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_ed25519 "${OVH_USER}@${OVH_HOST}" \
            "ls -1t ~/chat-builds 2>/dev/null | tail -n +6 | xargs -r -I{} rm -rf ~/chat-builds/{}" || true
